openapi: 3.1.0
info:
  title: Evidence API
  version: 0.1.0
  description: |
    Hash-only evidence and integrity proofs; PD stays off-chain (BR-2, BR-10).
  license:
    name: Proprietary
    url: https://consentrail.local/license
  x-domain: evd
  x-domain-prefix: EV
  x-product-slug: consentrail
servers:
  - url: https://api.consentrail.local
    description: Local API
security:
  - apiKey: []
tags:
  - name: Evidence
    description: Evidence hashes
  - name: Proofs
    description: Integrity proofs
components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey

paths:
  /v1/evidence/hashes:
    get:
      operationId: listEvidenceHashes
      summary: list Evidence Hashes
      tags: [Evidence]
      x-repository: EvidenceHash
      x-dynamodb:
        entityType: "EVIDENCE_HASH"
        pkPatternTemplate: "EVIDENCE_HASH#${hashId}"
        skPatternTemplate: "METADATA"
        pkPattern: entity
        usePkQuery: false
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
      responses:
        "200":
          description: Hashes
          content:
            application/json:
              schema:
                $ref: ./evidence.schemas.yaml#/components/schemas/EvidenceHashListResponse
        "401":
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: registerEvidenceHash
      summary: register Evidence Hash
      tags: [Evidence]
      x-repository: EvidenceHash
      x-dynamodb:
        entityType: "EVIDENCE_HASH"
        pkPatternTemplate: "EVIDENCE_HASH#${hashId}"
        skPatternTemplate: "METADATA"
        pkPattern: entity
        usePkQuery: false
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./evidence.schemas.yaml#/components/schemas/EvidenceHashCreate
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: ./evidence.schemas.yaml#/components/schemas/EvidenceHashResponse
        "400":
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        "401":
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        "409":
          $ref: ./common/responses.yaml#/components/responses/Conflict
        "422":
          $ref: ./common/responses.yaml#/components/responses/UnprocessableEntity
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/evidence/hashes/{hashId}:
    get:
      operationId: getEvidenceHash
      summary: get Evidence Hash
      tags: [Evidence]
      x-repository: EvidenceHash
      x-dynamodb:
        entityType: "EVIDENCE_HASH"
        pkPatternTemplate: "EVIDENCE_HASH#${hashId}"
        skPatternTemplate: "METADATA"
        pkPattern: entity
        usePkQuery: false
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
      parameters:
        - name: hashId
          in: path
          required: true
          schema:
            $ref: ./evidence.schemas.yaml#/components/schemas/EvidenceHashId
      responses:
        "200":
          description: Hash
          content:
            application/json:
              schema:
                $ref: ./evidence.schemas.yaml#/components/schemas/EvidenceHashResponse
        "400":
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        "401":
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        "404":
          $ref: ./common/responses.yaml#/components/responses/NotFound
        "409":
          $ref: ./common/responses.yaml#/components/responses/Conflict
        "422":
          $ref: ./common/responses.yaml#/components/responses/UnprocessableEntity
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/evidence/hashes/{hashId}/orphan:
    post:
      operationId: orphanEvidenceHash
      tags: [Evidence]
      summary: Orphan hash after counsel approval
      x-repository: EvidenceHash
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
        - name: hashId
          in: path
          required: true
          schema:
            $ref: ./evidence.schemas.yaml#/components/schemas/EvidenceHashId
      responses:
        "200":
          description: Orphaned
          content:
            application/json:
              schema:
                $ref: ./evidence.schemas.yaml#/components/schemas/EvidenceHashResponse
        "400":
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        "401":
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        "404":
          $ref: ./common/responses.yaml#/components/responses/NotFound
        "409":
          $ref: ./common/responses.yaml#/components/responses/Conflict
        "422":
          $ref: ./common/responses.yaml#/components/responses/UnprocessableEntity
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/evidence/integrity-proofs:
    get:
      operationId: listIntegrityProofs
      summary: list Integrity Proofs
      tags: [Proofs]
      x-repository: IntegrityProof
      x-dynamodb:
        entityType: "INTEGRITY_PROOF"
        pkPatternTemplate: "INTEGRITY_PROOF#${proofId}"
        skPatternTemplate: "METADATA"
        pkPattern: entity
        usePkQuery: false
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
      responses:
        "200":
          description: Proofs
          content:
            application/json:
              schema:
                $ref: ./evidence.schemas.yaml#/components/schemas/IntegrityProofListResponse
        "401":
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: issueIntegrityProof
      summary: issue Integrity Proof
      tags: [Proofs]
      x-repository: IntegrityProof
      x-dynamodb:
        entityType: "INTEGRITY_PROOF"
        pkPatternTemplate: "INTEGRITY_PROOF#${proofId}"
        skPatternTemplate: "METADATA"
        pkPattern: entity
        usePkQuery: false
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./evidence.schemas.yaml#/components/schemas/IntegrityProofCreate
      responses:
        "201":
          description: Issued
          content:
            application/json:
              schema:
                $ref: ./evidence.schemas.yaml#/components/schemas/IntegrityProofResponse
        "400":
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        "401":
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        "409":
          $ref: ./common/responses.yaml#/components/responses/Conflict
        "422":
          $ref: ./common/responses.yaml#/components/responses/UnprocessableEntity
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/evidence/integrity-proofs/{proofId}:
    get:
      operationId: getIntegrityProof
      summary: get Integrity Proof
      tags: [Proofs]
      x-repository: IntegrityProof
      x-dynamodb:
        entityType: "INTEGRITY_PROOF"
        pkPatternTemplate: "INTEGRITY_PROOF#${proofId}"
        skPatternTemplate: "METADATA"
        pkPattern: entity
        usePkQuery: false
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
      parameters:
        - name: proofId
          in: path
          required: true
          schema:
            $ref: ./evidence.schemas.yaml#/components/schemas/IntegrityProofId
      responses:
        "200":
          description: Proof
          content:
            application/json:
              schema:
                $ref: ./evidence.schemas.yaml#/components/schemas/IntegrityProofResponse
        "400":
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        "401":
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        "404":
          $ref: ./common/responses.yaml#/components/responses/NotFound
        "409":
          $ref: ./common/responses.yaml#/components/responses/Conflict
        "422":
          $ref: ./common/responses.yaml#/components/responses/UnprocessableEntity
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/evidence/integrity-proofs/{proofId}/verify:
    post:
      operationId: verifyIntegrityProof
      summary: verify Integrity Proof
      tags: [Proofs]
      x-repository: IntegrityProof
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
        - name: proofId
          in: path
          required: true
          schema:
            $ref: ./evidence.schemas.yaml#/components/schemas/IntegrityProofId
      responses:
        "200":
          description: Verification
          content:
            application/json:
              schema:
                $ref: ./evidence.schemas.yaml#/components/schemas/IntegrityProofResponse
        "400":
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        "401":
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        "404":
          $ref: ./common/responses.yaml#/components/responses/NotFound
        "409":
          $ref: ./common/responses.yaml#/components/responses/Conflict
        "422":
          $ref: ./common/responses.yaml#/components/responses/UnprocessableEntity
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
