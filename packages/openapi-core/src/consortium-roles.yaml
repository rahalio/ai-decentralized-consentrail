openapi: 3.1.0
info:
  title: Consortium Roles API
  version: 0.1.0
  description: |
    Record controller, processor, and DPO before live PD-processing evidence is accepted (BR-5).
  license:
    name: Proprietary
    url: https://consentrail.local/license
  x-domain: cnr
  x-domain-prefix: CR
  x-product-slug: consentrail
servers:
  - url: https://api.consentrail.local
    description: Local API
security:
  - apiKey: []
tags:
  - name: ConsortiumRoles
    description: Consortium role registry
components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey

paths:
  /v1/consortium-roles:
    get:
      operationId: listConsortiumRoles
      summary: list Consortium Roles
      tags: [ConsortiumRoles]
      x-repository: ConsortiumRole
      x-dynamodb:
        entityType: "CONSORTIUM_ROLE"
        pkPatternTemplate: "CONSORTIUM_ROLE#${roleId}"
        skPatternTemplate: "METADATA"
        pkPattern: entity
        usePkQuery: false
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                $ref: ./consortium-roles.schemas.yaml#/components/schemas/ConsortiumRoleListResponse
        "401":
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: assignConsortiumRole
      summary: assign Consortium Role
      tags: [ConsortiumRoles]
      x-repository: ConsortiumRole
      x-dynamodb:
        entityType: "CONSORTIUM_ROLE"
        pkPatternTemplate: "CONSORTIUM_ROLE#${roleId}"
        skPatternTemplate: "METADATA"
        pkPattern: entity
        usePkQuery: false
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./consortium-roles.schemas.yaml#/components/schemas/ConsortiumRoleCreate
      responses:
        "201":
          description: Assigned
          content:
            application/json:
              schema:
                $ref: ./consortium-roles.schemas.yaml#/components/schemas/ConsortiumRoleResponse
        "400":
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        "401":
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        "409":
          $ref: ./common/responses.yaml#/components/responses/Conflict
        "422":
          $ref: ./common/responses.yaml#/components/responses/UnprocessableEntity
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/consortium-roles/{roleId}:
    get:
      operationId: getConsortiumRole
      summary: get Consortium Role
      tags: [ConsortiumRoles]
      x-repository: ConsortiumRole
      x-dynamodb:
        entityType: "CONSORTIUM_ROLE"
        pkPatternTemplate: "CONSORTIUM_ROLE#${roleId}"
        skPatternTemplate: "METADATA"
        pkPattern: entity
        usePkQuery: false
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            $ref: ./consortium-roles.schemas.yaml#/components/schemas/ConsortiumRoleId
      responses:
        "200":
          description: Role
          content:
            application/json:
              schema:
                $ref: ./consortium-roles.schemas.yaml#/components/schemas/ConsortiumRoleResponse
        "400":
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        "401":
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        "404":
          $ref: ./common/responses.yaml#/components/responses/NotFound
        "409":
          $ref: ./common/responses.yaml#/components/responses/Conflict
        "422":
          $ref: ./common/responses.yaml#/components/responses/UnprocessableEntity
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/consortium-roles/{roleId}/attest:
    post:
      operationId: attestConsortiumRole
      summary: attest Consortium Role
      tags: [ConsortiumRoles]
      x-repository: ConsortiumRole
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
        - name: roleId
          in: path
          required: true
          schema:
            $ref: ./consortium-roles.schemas.yaml#/components/schemas/ConsortiumRoleId
      responses:
        "200":
          description: Attested
          content:
            application/json:
              schema:
                $ref: ./consortium-roles.schemas.yaml#/components/schemas/ConsortiumRoleResponse
        "400":
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        "401":
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        "404":
          $ref: ./common/responses.yaml#/components/responses/NotFound
        "409":
          $ref: ./common/responses.yaml#/components/responses/Conflict
        "422":
          $ref: ./common/responses.yaml#/components/responses/UnprocessableEntity
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/consortium-roles/go-live-gate:
    get:
      operationId: getConsortiumGoLiveGate
      summary: get Consortium Go Live Gate
      tags: [ConsortiumRoles]
      x-repository: ConsortiumRole
      responses:
        "200":
          description: Gate status
          content:
            application/json:
              schema:
                $ref: ./consortium-roles.schemas.yaml#/components/schemas/GoLiveGateResponse
        "401":
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
