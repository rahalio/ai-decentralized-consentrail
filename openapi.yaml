openapi: 3.0.3
info:
  title: Consentrail
  version: 0.1.0
  description: GDPR accountability rail for consent, rights, security events, and obligation contracts
    with off-chain PD.
  x-product-slug: ai-decentralized-consentrail
  x-source: ai-in-decentralized+ai/ibm-Blockchain and GDPR/
servers:
- url: https://api.example.com
tags:
- name: Consents
  description: Lawfulness and consent records
- name: Rights
  description: Data-subject rights cases
- name: SecurityEvents
  description: Security of processing logs
- name: Obligations
  description: Controller/processor obligation contracts
- name: Evidence
  description: Hash evidence and integrity proofs
- name: RegulatorViews
  description: Supervisor evidence views
paths:
  /v1/consents:
    get:
      operationId: listConsentRecords
      tags:
      - Consents
      security:
      - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelopeConsentRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
      parameters:
      - $ref: '#/components/parameters/Cursor'
    post:
      operationId: captureConsent
      tags:
      - Consents
      security:
      - BearerAuth: []
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelopeConsentRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRecordCreate'
  /v1/consents/{consentId}/withdraw:
    post:
      operationId: withdrawConsent
      tags:
      - Consents
      security:
      - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelopeConsentRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
      parameters:
      - name: consentId
        in: path
        required: true
        schema:
          type: string
  /v1/rights-cases:
    get:
      operationId: listRightsCases
      tags:
      - Rights
      security:
      - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelopeRightsCase'
        '401':
          $ref: '#/components/responses/Unauthorized'
      parameters:
      - $ref: '#/components/parameters/Cursor'
    post:
      operationId: openRightsCase
      tags:
      - Rights
      security:
      - BearerAuth: []
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelopeRightsCase'
        '401':
          $ref: '#/components/responses/Unauthorized'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RightsCaseCreate'
  /v1/security-events:
    post:
      operationId: recordSecurityEvent
      tags:
      - SecurityEvents
      security:
      - ApiKeyAuth: []
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelopeSecurityEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityEvent'
    get:
      operationId: listSecurityEvents
      tags:
      - SecurityEvents
      security:
      - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelopeSecurityEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
      parameters:
      - $ref: '#/components/parameters/Cursor'
  /v1/obligations:
    get:
      operationId: listObligationContracts
      tags:
      - Obligations
      security:
      - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelopeObligationContract'
        '401':
          $ref: '#/components/responses/Unauthorized'
      parameters:
      - $ref: '#/components/parameters/Cursor'
    post:
      operationId: createObligationContract
      tags:
      - Obligations
      security:
      - BearerAuth: []
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelopeObligationContract'
        '401':
          $ref: '#/components/responses/Unauthorized'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObligationContract'
  /v1/obligations/{contractId}/evaluate:
    post:
      operationId: evaluateObligationContract
      tags:
      - Obligations
      security:
      - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelopeComplianceAlert'
        '401':
          $ref: '#/components/responses/Unauthorized'
      parameters:
      - name: contractId
        in: path
        required: true
        schema:
          type: string
  /v1/evidence/hashes:
    post:
      operationId: registerEvidenceHash
      tags:
      - Evidence
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelopeEvidenceHash'
        '401':
          $ref: '#/components/responses/Unauthorized'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceHash'
  /v1/evidence/integrity-proofs:
    post:
      operationId: issueIntegrityProof
      tags:
      - Evidence
      security:
      - BearerAuth: []
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelopeIntegrityProof'
        '401':
          $ref: '#/components/responses/Unauthorized'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrityProofCreate'
  /v1/regulator-views:
    get:
      operationId: listRegulatorViews
      tags:
      - RegulatorViews
      security:
      - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelopeRegulatorView'
        '401':
          $ref: '#/components/responses/Unauthorized'
      parameters:
      - $ref: '#/components/parameters/Cursor'
    post:
      operationId: grantRegulatorView
      tags:
      - RegulatorViews
      security:
      - BearerAuth: []
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelopeRegulatorView'
        '401':
          $ref: '#/components/responses/Unauthorized'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegulatorView'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Unprocessable entity
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ResponseMeta:
      type: object
      required:
      - requestId
      - timestamp
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    Problem:
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    ConsentRecord:
      type: object
      required:
      - id
      - subjectRef
      - status
      properties:
        id:
          type: string
        subjectRef:
          type: string
        purpose:
          type: string
        explicit:
          type: boolean
        status:
          type: string
          enum:
          - active
          - withdrawn
        ownerMediated:
          type: boolean
    ConsentRecordCreate:
      type: object
      required:
      - subjectRef
      - purpose
      properties:
        subjectRef:
          type: string
        purpose:
          type: string
        explicit:
          type: boolean
        ownerMediated:
          type: boolean
    RightsCase:
      type: object
      required:
      - id
      - type
      - status
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - access
          - rectification
          - erasure
          - portability
          - breach_inform
        status:
          type: string
          enum:
          - open
          - fulfilled
          - refused
        subjectRef:
          type: string
    RightsCaseCreate:
      type: object
      required:
      - type
      - subjectRef
      properties:
        type:
          type: string
          enum:
          - access
          - rectification
          - erasure
          - portability
          - breach_inform
        subjectRef:
          type: string
    SecurityEvent:
      type: object
      required:
      - id
      - kind
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
          - access
          - key
          - participant_verify
        participantId:
          type: string
        detail:
          type: string
    ObligationContract:
      type: object
      required:
      - id
      - controllerId
      - processorId
      properties:
        id:
          type: string
        controllerId:
          type: string
        processorId:
          type: string
        termsHash:
          type: string
    ComplianceAlert:
      type: object
      required:
      - id
      - contractId
      - status
      properties:
        id:
          type: string
        contractId:
          type: string
        status:
          type: string
          enum:
          - compliant
          - breach
        detail:
          type: string
    EvidenceHash:
      type: object
      required:
      - id
      - hash
      properties:
        id:
          type: string
        hash:
          type: string
        orphaned:
          type: boolean
        purpose:
          type: string
    IntegrityProof:
      type: object
      required:
      - id
      - artefactRef
      - proof
      properties:
        id:
          type: string
        artefactRef:
          type: string
        proof:
          type: string
        issuedAt:
          type: string
          format: date-time
    IntegrityProofCreate:
      type: object
      required:
      - artefactRef
      properties:
        artefactRef:
          type: string
    RegulatorView:
      type: object
      required:
      - id
      - regulatorId
      - scope
      properties:
        id:
          type: string
        regulatorId:
          type: string
        scope:
          type: array
          items:
            type: string
        includesPersonalData:
          type: boolean
      description: includesPersonalData must always be false
    DataEnvelopeConsentRecord:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/ConsentRecord'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeConsentRecord:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ConsentRecord'
            nextCursor:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    DataEnvelopeRightsCase:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/RightsCase'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeRightsCase:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/RightsCase'
            nextCursor:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    DataEnvelopeSecurityEvent:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/SecurityEvent'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeSecurityEvent:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/SecurityEvent'
            nextCursor:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    DataEnvelopeObligationContract:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/ObligationContract'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeObligationContract:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ObligationContract'
            nextCursor:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    DataEnvelopeComplianceAlert:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/ComplianceAlert'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeComplianceAlert:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ComplianceAlert'
            nextCursor:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    DataEnvelopeEvidenceHash:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/EvidenceHash'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeEvidenceHash:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/EvidenceHash'
            nextCursor:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    DataEnvelopeIntegrityProof:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/IntegrityProof'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeIntegrityProof:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/IntegrityProof'
            nextCursor:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    DataEnvelopeRegulatorView:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/RegulatorView'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeRegulatorView:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/RegulatorView'
            nextCursor:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
